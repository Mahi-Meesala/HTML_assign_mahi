<!DOCTYPE html>
<html>
<head>
    <title>Visitor Info</title>
</head>
<body>
    <h1>Visitors Information</h1>
    <hr>
    <form>
        <table>
            <tr>
                <td>Email Address:</td>
                <td>
                    <input type="text" name="email">
                </td>
            </tr>
            <tr>
                <td>Interest:</td>
                <td>
                    <input type="checkbox" name="research">Research
                    <input type="checkbox" name="purchase">Purchase
                </td>
            </tr>
            <tr>
                <td>Occupation:</td>
                <td>
                    <select name="occupation">
                        <option>Student</option>
                        <option selected>Employee</option>
                        <option>Business</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Want us to send you junk emails?</td>
                <td>
                    <input type="radio" name="junkemail">
                    Absolutely

                    <input type="radio" name="junkemail">
                    No way man
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
