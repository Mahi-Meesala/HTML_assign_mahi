<html>
<head>
    <title>Alignment</title>
</head>
<body>
    <h2 align="left">This text is aligned to the Left</h2>
    <h2 align="center">This text is aligned to the Center</h2>
    <h2 align="right">This text is aligned to the Right</h2>
    <p align="justify">
        This text is aligned using Justify alignment. The text will
        spread evenly between the left and right margins.
    </p>
</body>
</html>
