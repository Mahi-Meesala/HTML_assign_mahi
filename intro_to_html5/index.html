<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Forms Assignment</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Please fill in the details below.</p>
    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>
        <label for="documents">Upload Documents:</label>
        <input type="file" id="documents" name="documents" multiple><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
